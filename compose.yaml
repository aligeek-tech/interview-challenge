services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge_dev
      POSTGRES_DB: capacity_booking
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55439}:5432"
    volumes:
      - challenge-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d capacity_booking"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  challenge-db:
